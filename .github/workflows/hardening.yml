# Added by the grok-build-hardened project.

name: Hardening invariants

on:
  push:
    branches: [main]
    tags: ['v*-hardened', 'v*-hardened.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardening-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-audit:
    name: Fail-closed source audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure read-only upstream identity
        run: python3 scripts/hardening/hardening.py setup-remotes
      - name: Verify hardening invariants
        run: python3 scripts/hardening/hardening.py check

  compile:
    name: Compile (${{ matrix.os }})
    needs: source-audit
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
          - os: macos-latest
            python: python3
          - os: windows-latest
            python: python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure read-only upstream identity
        run: ${{ matrix.python }} scripts/hardening/hardening.py setup-remotes
      - name: Verify hardening invariants on this host
        run: ${{ matrix.python }} scripts/hardening/hardening.py check
      - name: Install protobuf compiler on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Install protobuf compiler on macOS
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install protobuf compiler on Windows
        if: runner.os == 'Windows'
        run: choco install protoc --version 29.3.0 --no-progress --yes
      - name: Select the repository-pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Compile the hardened binary
        run: ${{ matrix.python }} scripts/hardening/hardening.py cargo-check
