# Added by the grok-build-hardened project.

name: Release hardened binaries

on:
  push:
    tags:
      - 'v*-hardened'
      - 'v*-hardened.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configure read-only upstream identity
        run: python3 scripts/hardening/hardening.py setup-remotes
      - name: Validate tag and hardening invariants
        id: release
        run: >-
          python3 scripts/hardening/hardening.py validate-release-tag
          --tag "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"

  build:
    name: Build (${{ matrix.os }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
          - os: macos-latest
            python: python3
          - os: windows-latest
            python: python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configure read-only upstream identity
        run: ${{ matrix.python }} scripts/hardening/hardening.py setup-remotes
      - name: Install build prerequisites on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Install build prerequisites on macOS
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install build prerequisites on Windows
        if: runner.os == 'Windows'
        run: choco install protoc --version 29.3.0 --no-progress --yes
      - name: Select the repository-pinned Rust toolchain
        run: rustup show
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Audit and build with network disabled
        run: ${{ matrix.python }} scripts/hardening/hardening.py build-offline
      - name: Package binary and notices
        id: package
        run: >-
          ${{ matrix.python }} scripts/hardening/hardening.py package
          --version "${{ needs.prepare.outputs.version }}"
          --output-dir dist
      - name: Upload packaged binary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish immutable GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release notes from the tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download packaged binaries
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create checksums and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/*.tar.gz dist/*.zip)
          [[ "${#archives[@]}" -eq 3 ]] || {
            printf 'Expected three platform archives, found %s\n' "${#archives[@]}" >&2
            exit 1
          }
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'Release already exists and will not be modified: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          (
            cd dist
            sha256sum -- *.tar.gz *.zip >SHA256SUMS
          )
          gh release create "$RELEASE_TAG" \
            "${archives[@]}" dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "grok-build-hardened $RELEASE_VERSION" \
            --notes-file RELEASE.md
